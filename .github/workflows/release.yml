name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or tag, for example v1.2.3"
        required: true
        type: string
      publish_npm:
        description: "Request npm publish readiness review; this workflow does not publish."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository template
        shell: bash
        run: bash scripts/validate-template.sh

      - name: Install package dependencies
        run: npm install

      - name: Lint package
        run: npm run lint --if-present

      - name: Test package
        run: npm test

      - name: Smoke CLI
        run: npm run smoke

      - name: Dry-run npm package
        run: npm run pack:dry-run

      - name: Record release candidate
        shell: bash
        run: |
          set -euo pipefail

          release_ref="${{ inputs.version || github.ref_name }}"
          {
            echo "Release candidate: ${release_ref}"
            echo "Publishing status: disabled in automation"
            echo "npm publish command is intentionally not run by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-gate:
    name: Publishing gate
    needs: release-readiness
    if: ${{ inputs.publish_npm == true }}
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Confirm publishing remains manual
        run: |
          echo "Publishing is gated by the npm-publish environment and intentionally disabled."
          echo "Use docs/npm-publishing.md for the reviewed manual publish procedure."
