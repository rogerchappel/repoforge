name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or tag, for example v1.2.3"
        required: true
        type: string
      publish_npm:
        description: "Request npm publish readiness review; this workflow does not publish."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository template
        shell: bash
        run: bash scripts/validate-template.sh

      - name: Prepare npm package fixture
        shell: bash
        run: |
          set -euo pipefail

          fixture="${RUNNER_TEMP}/repoforge-npm-package"
          cp -R templates/npm-package "$fixture"

          package_name_placeholder="$(printf '{{%s}}' PACKAGE_NAME)"
          package_description_placeholder="$(printf '{{%s}}' PACKAGE_DESCRIPTION)"
          author_name_placeholder="$(printf '{{%s}}' AUTHOR_NAME)"
          license_placeholder="$(printf '{{%s}}' LICENSE)"

          find "$fixture" -type f -print0 | xargs -0 sed -i \
            -e "s|${package_name_placeholder}|@repoforge/smoke-package|g" \
            -e "s|${package_description_placeholder}|Repoforge smoke package fixture|g" \
            -e "s|${author_name_placeholder}|Repoforge Maintainers|g" \
            -e "s|${license_placeholder}|MIT|g"

          echo "fixture=$fixture" >> "$GITHUB_ENV"

      - name: Install package dependencies
        working-directory: ${{ env.fixture }}
        run: npm install

      - name: Lint package if present
        working-directory: ${{ env.fixture }}
        run: npm run lint --if-present

      - name: Test package
        working-directory: ${{ env.fixture }}
        run: npm test

      - name: Smoke package import
        working-directory: ${{ env.fixture }}
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'EOF'
          import { createMessage } from "./src/index.js";

          if (createMessage("release") !== "hello release") {
            throw new Error("package smoke import failed");
          }
          EOF

      - name: Dry-run npm package
        working-directory: ${{ env.fixture }}
        run: npm pack --dry-run

      - name: Record release candidate
        shell: bash
        run: |
          set -euo pipefail

          release_ref="${{ inputs.version || github.ref_name }}"
          {
            echo "Release candidate: ${release_ref}"
            echo "Publishing status: disabled in automation"
            echo "npm publish command is intentionally not run by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-gate:
    name: Publishing gate
    needs: release-readiness
    if: ${{ inputs.publish_npm == true }}
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Confirm publishing remains manual
        run: |
          echo "Publishing is gated by the npm-publish environment and intentionally disabled."
          echo "Use docs/npm-publishing.md for the reviewed manual publish procedure."
