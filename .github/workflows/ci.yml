name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate CLI, scaffold, and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository template
        shell: bash
        run: bash scripts/validate-template.sh

      - name: Install package dependencies
        run: npm install

      - name: Lint package
        run: npm run lint --if-present

      - name: Test package
        run: npm test

      - name: Smoke CLI
        run: npm run smoke

      - name: Dry-run npm package
        run: npm run pack:dry-run
